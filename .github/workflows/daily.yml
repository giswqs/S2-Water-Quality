name: Daily Sentinel-2 products

# Downloads the latest Sentinel-2 L1C scene, runs ACOLITE atmospheric
# correction + MoE-VAE inference, and publishes the resulting Cloud Optimized
# GeoTIFFs to the "S2-Data" GitHub release and a Hugging Face dataset.
#
# This workflow targets a SELF-HOSTED runner because the pipeline depends on a
# recent ACOLITE install (radcor support; set ACOLITE_DIR) and processes
# multi-hundred-MB Sentinel-2 .SAFE products onto the local data drive
# (/media/hdd/Data/S2).

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update releases

concurrency:
  group: daily-s2
  cancel-in-progress: false

jobs:
  process:
    runs-on: [self-hosted, s2]
    timeout-minutes: 240
    env:
      # Path to a recent ACOLITE install (radcor support, 2024+).
      ACOLITE_DIR: ${{ vars.ACOLITE_DIR }}
      # Where Sentinel-2 scenes, intermediate L2, and products live.
      S2_DATA_DIR: /media/hdd/Data/S2/data
      S2_OUTPUT_DIR: /media/hdd/Data/S2/output
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the latest scene
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
        run: python download_latest.py

      - name: Process the latest scene
        run: python run_folder.py

      - name: List products
        run: ls -lh "$S2_OUTPUT_DIR"

      - name: Publish GeoTIFFs to the S2-Data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view S2-Data >/dev/null 2>&1 || \
            gh release create S2-Data \
              --title "S2-Data" \
              --notes "Cloud Optimized GeoTIFFs (chl-a, TSS, aCDOM) generated automatically from Sentinel-2 L1C scenes (ACOLITE + MoE-VAE). Updated daily; products from each acquisition date accumulate here."
          gh release upload S2-Data "$S2_OUTPUT_DIR"/*.tif --clobber

      - name: Publish GeoTIFFs to the Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "giswqs/S2-Water-Quality"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id, repo_type="dataset", exist_ok=True)
          api.upload_folder(
              folder_path=os.environ["S2_OUTPUT_DIR"],
              path_in_repo="cogs",
              repo_id=repo_id,
              repo_type="dataset",
              allow_patterns=["*.tif"],
              commit_message="Add daily Sentinel-2 water-quality products",
          )
          print("Uploaded GeoTIFFs to", f"https://huggingface.co/datasets/{repo_id}")
          PY
